      setTimeout(()=>drawRadar(ev),30)
    }
    function drawRadar(ev){let cnv=document.getElementById("radar");if(!cnv)return;let ctx=cnv.getContext("2d"),dpr=devicePixelRatio||1,w=cnv.clientWidth,h=cnv.clientHeight;cnv.width=w*dpr;cnv.height=h*dpr;ctx.scale(dpr,dpr);let cx=w/2,cy=h/2,r=Math.min(w,h)*.34,vals=categories.map(c=>ev.categoryScores[c[0]]/c[2]),pts=vals.map((v,i)=>{let a=-Math.PI/2+i*2*Math.PI/vals.length;return[cx+Math.cos(a)*r*v,cy+Math.sin(a)*r*v,a]});ctx.clearRect(0,0,w,h);ctx.strokeStyle="rgba(245,235,221,.18)";for(let ring=1;ring<=4;ring++){ctx.beginPath();categories.forEach((_,i)=>{let a=-Math.PI/2+i*2*Math.PI/categories.length,x=cx+Math.cos(a)*r*ring/4,y=cy+Math.sin(a)*r*ring/4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke()}categories.forEach((c,i)=>{let a=-Math.PI/2+i*2*Math.PI/categories.length;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();ctx.fillStyle="rgba(245,235,221,.78)";ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText(reportCat(c),cx+Math.cos(a)*(r+24),cy+Math.sin(a)*(r+24))});ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle="rgba(184,106,58,.34)";ctx.strokeStyle="#D9A45F";ctx.lineWidth=2;ctx.fill();ctx.stroke()}
    renderNav();render();
  </script>
